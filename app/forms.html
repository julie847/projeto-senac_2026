<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style/forms.css">
  <script src="./scripts/menu.js" defer></script>
  <script type="module" src="./scripts/form.js"></script>
</head>

<body>
  <div id="container">
    <header>
      <nav>
        <img src="./images/lampada_atual.png">
        <a class="link-do-cabecalho" href="./index.html">Viajei</a>
        <a class="link-do-cabecalho" href="./about.html">Sobre</a>
        <a class="link-do-cabecalho" href="./forms.html">Crie seu blog !</a>
      </nav>
    </header>

    <main>
      <form id="post-form">
        <label for="autor"> autor: </label>
        <input id="autor" type="text" name="autor" placeholder="(ex: Julie Andrade)">

        <label for="titulo"> Titulo da história: </label>
        <input id="titulo" type="text" name="titulo" placeholder="">

        <label for="Email"> Email: </label>
        <input id="Email" type="Email" name="Email" placeholder="(ex: julie.andrd@gmail.com)">

        <label for="historia"> História: </label>
        <textarea id="historia" cols="50" rows="20" name="historia"
          placeholder="minha vida, nem sempre foi festa, mas meu coracção sempre foi carnaval..."></textarea>

        <button type="submit"> enviar </button>

      </form>
    </main>

    <dialog id="modal">
      <button autofocus>Fechar</button>
      <div id="modal-content"></div>
    </dialog>


    <footer>
      <div id="historias"></div>
    </footer>
  </div>
</body>

</html>
